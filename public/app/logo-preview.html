<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview Logo Sibanki</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;padding:24px}
h2{margin-bottom:16px;font-size:1rem;color:#64748B}
.preview{display:flex;flex-direction:column;gap:32px;max-width:400px}
.row{display:flex;align-items:center;padding:20px;border-radius:12px}
.dark{background:#0d1825;border:1px solid rgba(255,255,255,.08)}
.light{background:#fff;border:1px solid rgba(15,23,42,.1)}
.sibanki-logo{display:flex;align-items:center;justify-content:center}
.sibanki-logo-text{font-family:'Outfit',sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:-0.03em;white-space:nowrap}
.dark .sibanki-logo-text{color:#f0f4f8}
.light .sibanki-logo-text{color:#0F172A}
</style>
</head>
<body>
<div class="preview">
<h2>Modo escuro</h2>
<div class="row dark">
<div class="sibanki-logo"><span class="sibanki-logo-text">Sibanki</span></div>
</div>
<h2>Modo claro</h2>
<div class="row light">
<div class="sibanki-logo"><span class="sibanki-logo-text">Sibanki</span></div>
</div>
</div>
</body>
</html>
