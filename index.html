  <link rel="apple-touch-startup-image" media="screen and (device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)"   href="/splash/1290x2796.png">

  <title>Sibanki - Controle Financeiro</title>
  <style>
    html, body { margin: 0; background: #0a0a0a; }

    /* ── Splash pré-React ─────────────────────────────────────────────────────
       Design idêntico ao AppLoadingScreen React — elimina o "pop" visual
       quando o bundle JS assume o controle. Animações em CSS puro (sem JS).
       ──────────────────────────────────────────────────────────────────────── */
    #sib-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
      background: #0a0a0a;
      font-family: Inter, -apple-system, system-ui, sans-serif;
    }
    #sib-icon-wrap {
      position: relative; width: 96px; height: 96px;
      display: flex; align-items: center; justify-content: center;
    }
    #sib-ring {
      position: absolute; inset: 0; width: 100%; height: 100%;
      animation: sib-spin 1.6s cubic-bezier(.6,.15,.4,.85) infinite;
    }
    #sib-bench {
      position: relative; z-index: 1;
      animation: sib-pulse 2s ease-in-out infinite;
    }
    #sib-text { text-align: center; }
    .sib-wordmark {
      font-size: 13px; font-weight: 700; letter-spacing: 0.25em;
      text-transform: uppercase; color: #fff; margin-bottom: 10px;
    }
    .sib-subtitle {
      font-size: 11px; font-weight: 600; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(255,255,255,0.45);
      animation: sib-pulse 2s ease-in-out infinite;
    }
    @keyframes sib-spin  { to { transform: rotate(360deg); } }
    @keyframes sib-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  </style>
</head>
<body>
  <div id="root">
    <div id="sib-splash">
      <div id="sib-icon-wrap">
        <!-- Anel girando -->
        <svg id="sib-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2.5"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="#f5f5f5" stroke-width="2.5"
                  stroke-dasharray="52 224" stroke-linecap="round"/>
        </svg>
        <!-- Ícone banquinho (pulsando) -->
        <svg id="sib-bench" width="36" height="36" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="15" y="17" width="34" height="10" rx="5" fill="#f5f5f5"/>
          <rect x="14" y="26" width="9"  height="27" rx="4.5" fill="#f5f5f5" transform="rotate(16 18.5 28)"/>
          <rect x="41" y="26" width="9"  height="27" rx="4.5" fill="#f5f5f5" transform="rotate(-16 45.5 28)"/>
        </svg>
      </div>
      <div id="sib-text">
        <div class="sib-wordmark">sibanki</div>
        <div class="sib-subtitle">Calculando a sua soberania</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
