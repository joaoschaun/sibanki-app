  <title>Sibanki - Controle Financeiro</title>
  <style>
    /* Splash pré-React: evita tela branca/preta vazia enquanto o bundle carrega */
    html, body { margin: 0; background: #0a0a0a; }
    #sib-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: #0a0a0a; color: #fff;
      font-family: Inter, -apple-system, system-ui, sans-serif;
    }
    #sib-splash .sib-logo { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; animation: sib-pulse 1.6s ease-in-out infinite; }
    #sib-splash .sib-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.45); }
    @keyframes sib-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  </style>
</head>
<body>
  <div id="root">
    <div id="sib-splash">
      <svg class="sib-logo" width="148" height="34" viewBox="0 0 132 30" xmlns="http://www.w3.org/2000/svg" style="display:block">
        <rect x="5.6" y="4.4" width="16" height="4.6" rx="2.3" fill="#f5f5f5"/>
        <rect x="5" y="8.6" width="4.2" height="12.6" rx="2.1" fill="#f5f5f5" transform="rotate(16 7.1 9.5)"/>
        <rect x="17.6" y="8.6" width="4.2" height="12.6" rx="2.1" fill="#f5f5f5" transform="rotate(-16 19.7 9.5)"/>
        <text x="31" y="21.5" font-family="Inter, sans-serif" font-size="17.5" font-weight="700" fill="#f5f5f5" letter-spacing="-0.7">sibanki</text>
      </svg>
      <div class="sib-tag">Seu sistema operacional financeiro</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
